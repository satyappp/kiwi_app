<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#4caf50" />
    <title>オフライン | ReFruits</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fff8e7; color: #2f5233; text-align: center; }
      main { width: min(100%, 420px); padding: 36px 28px; border: 1px solid rgba(76, 175, 80, 0.18); border-radius: 24px; background: rgba(255,255,255,0.86); box-shadow: 0 18px 50px rgba(47,82,51,0.1); }
      img { display: block; width: 180px; height: auto; margin: 0 auto 24px; }
      h1 { margin: 0; font-size: 1.35rem; }
      p { margin: 12px 0 0; color: #6d6b5f; line-height: 1.7; }
      button { margin-top: 24px; min-height: 48px; border: 0; border-radius: 14px; padding: 0 24px; background: #4caf50; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/brand/refruits-logo.png" alt="ReFruits" />
      <h1>インターネットに接続できません</h1>
      <p>接続を確認してから、もう一度お試しください。入力データはオフライン保存されません。</p>
      <button type="button" onclick="location.reload()">再読み込み</button>
    </main>
  </body>
</html>
